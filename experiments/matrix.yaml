schema_version: 1
project: vlm_agent_rl
model: Qwen/Qwen2.5-VL-3B-Instruct

invariants:
  filter_enabled: false
  rollout_train_parity_gate: true
  qwen3_vl_formal_no_concat_allowed: false
  base_eval_temperature: 0
  state_relative_requires_preflight: true

methods:
  base:
    train: false
    eval_only: true
  concat_grpo:
    advantage: grpo
    concat_multi_turn: true
    critic: false
    rollout_n: 4
  no_concat_gae:
    advantage: no_concat_gae
    concat_multi_turn: false
    critic: true
    rollout_n: 1
  no_concat_episode_grpo:
    advantage: no_concat_episode_grpo
    concat_multi_turn: false
    critic: false
    rollout_n: 4

environments:
  sokoban:
    train: examples/train/sokoban/train_sokoban_vision.yaml
    train_seeds: [1, 10000]  # Training: 10000 requested seeds -> 3902 distinct boards
    validation: examples/train/sokoban/val_sokoban_vision.yaml
    validation_seeds: [10004, 10579]  # 128 enumerated boards, disjoint from train/test
    evaluation: examples/evaluate/sokoban/config.yaml
    evaluation_seeds: [20003, 20655]  # Final test: enumerated board-disjoint seed_list
    # Requested seeds are not task identities in Sokoban: reset() advances the
    # seed until min_solution_steps is met, so different seeds can produce the
    # same board. This artifact fingerprints the board each seed actually
    # generates and proves the test boards are unseen.
    board_split: experiments/sokoban_board_split.json
  navigation:
    train: examples/train/navigation/train_navigation.yaml
    train_seeds: [0, 1199]  # Training: base_train dataset (1200 tasks)
    validation: examples/train/navigation/val_navigation.yaml
    validation_seeds: [0, 29]  # Validation: base tasks 0-29 (held-out)
    evaluation: examples/evaluate/navigation/config_base.yaml
    evaluation_seeds: [30, 59]  # Final test: base tasks 30-59, disjoint from train and val

funnel:
  smoke:
    steps: 5
    core_method_steps: 1
    train_batch_size: 2
    rollout_n: 2
    evaluation_episodes: 4
  core_screening:
    methods: [concat_grpo, no_concat_gae, no_concat_episode_grpo]
    environments: [sokoban, navigation]
    seeds: [0]
    steps: 50
  episode_screening:
    rewards: [outcome, bounded_process, format_gate]
    policy_objectives: [token, turn, trajectory]
    environments: [sokoban]
    seeds: [0]
    steps: 50
  confirmatory:
    select_after_screening: true
    environments: [sokoban, navigation]
    seeds: [0, 1, 2]
    steps: 401
  anti_cheating:
    observation_ablations: [none, remove, shuffle_tiles]
    checks:
      - template_collapse
      - group_reward_variance
      - invalid_actions
      - reward_turn_correlation
      - representative_failures

required_result_columns:
  - Method
  - Visual Success
  - Peak VRAM
  - GPU·h
  - Mean Turns
  - Ratio P95

gates:
  parity:
    max_p95_ratio_deviation: 0.1
    max_p99_ratio_deviation: 0.2
    max_mean_abs_logprob_delta: 0.05
    max_clip_fraction: 0.01
  state_relative:
    min_rows: 64
    max_missing_anchor_fraction: 0.01
    min_comparable_row_fraction: 0.20
    min_action_diversity_fraction: 0.10
    min_mean_return_to_go_variance: 0.0001
